name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The real CMS. The build also passes with WordPress down (pages fall back to defaults).
      WORDPRESS_API_URL: https://wp.draftly.blog/graphql
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint
        # Not blocking yet: origin/main has 47 lint errors (46 @next/next/no-html-link-for-pages
        # on plain <a> links, 1 react-hooks/set-state-in-effect in OnThisPage). Remove this once they're fixed.
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
